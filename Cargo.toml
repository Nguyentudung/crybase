[package]
name = "crydb"
version = "0.1.1"
edition = "2024"
description = "An experimental database engine built from scratch in Rust"
license = "MIT"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
