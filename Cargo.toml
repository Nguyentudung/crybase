[package]
name = "crybase"
version = "0.1.1"
edition = "2024"
description = "A lightweight backend platform built with Rust and SQLite"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

